<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 · Tahtanın Dışındasın · santranc.net</title>
  <meta name="theme-color" content="#0b0d12">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: #000000;
      color: #ffffff;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient atmospheric glow */
    .ambient-glow {
      position: absolute;
      top: 15%;
      left: 50%;
      transform: translate(-50%, -20%);
      width: min(700px, 90vw);
      height: min(450px, 60vh);
      background: radial-gradient(circle, rgba(59, 130, 246, 0.14) 0%, rgba(147, 51, 234, 0.08) 40%, transparent 75%);
      pointer-events: none;
      z-index: 0;
      filter: blur(40px);
    }

    /* Header */
    .top-bar {
      position: relative;
      z-index: 10;
      padding: 24px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1380px;
      margin: 0 auto;
      width: 100%;
    }

    .brand img {
      height: 22px;
      width: auto;
      display: block;
    }

    .back-link {
      font-size: 13.5px;
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.03);
      transition: all 0.2s ease;
    }

    .back-link:hover {
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.08);
      transform: translateX(-2px);
    }

    /* Main Content */
    .main-wrap {
      position: relative;
      z-index: 10;
      max-width: 900px;
      margin: auto;
      padding: 40px 24px 60px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Floating Chess Visual */
    .visual-stage {
      position: relative;
      width: 220px;
      height: 220px;
      margin-bottom: 24px;
      display: grid;
      place-items: center;
    }

    .floating-knight {
      width: 170px;
      height: auto;
      display: block;
      user-select: none;
      pointer-events: none;
      filter: drop-shadow(0 24px 32px rgba(0, 0, 0, 0.85)) drop-shadow(0 0 20px rgba(59, 130, 246, 0.2));
      animation: knightDrift 5s ease-in-out infinite alternate;
    }

    @keyframes knightDrift {
      0% {
        transform: translateY(4px) rotate(-2deg);
      }
      50% {
        transform: translateY(-8px) rotate(1deg);
      }
      100% {
        transform: translateY(-16px) rotate(-3deg);
      }
    }

    /* Subtle Architectural 404 Watermark */
    .watermark-404 {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'PT Serif', Georgia, serif;
      font-size: clamp(160px, 24vw, 280px);
      font-weight: 700;
      color: rgba(255, 255, 255, 0.035);
      letter-spacing: -0.06em;
      line-height: 0.8;
      pointer-events: none;
      user-select: none;
      z-index: 0;
    }

    h1 {
      font-family: 'PT Serif', Georgia, serif;
      font-size: clamp(34px, 5.5vw, 56px);
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1.15;
      color: #ffffff;
      margin-top: 8px;
      margin-bottom: 16px;
    }

    p.desc {
      font-size: clamp(15px, 2vw, 17px);
      color: rgba(255, 255, 255, 0.65);
      line-height: 1.6;
      max-width: 520px;
      margin-bottom: 36px;
    }

    /* Action Buttons */
    .actions-wrap {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
    }

    .btn-play {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 32px;
      border-radius: 9999px;
      background: #ffffff;
      color: #000000;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-decoration: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 20px rgba(255, 255, 255, 0.25);
    }

    .btn-play:hover {
      background: #eaeaea;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(255, 255, 255, 0.35);
    }

    .btn-play:active {
      transform: scale(0.97);
    }

    .btn-rules {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 26px;
      border-radius: 9999px;
      background: transparent;
      color: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-rules:hover {
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.35);
      background: rgba(255, 255, 255, 0.05);
    }

    /* Footer */
    .foot-info {
      position: relative;
      z-index: 10;
      padding: 24px;
      text-align: center;
      font-size: 12.5px;
      color: rgba(255, 255, 255, 0.35);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
    }

    .foot-info img {
      height: 16px;
      width: auto;
      opacity: 0.8;
      transition: opacity 0.2s;
    }

    .foot-info img:hover {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>

  <header class="top-bar">
    <a href="/" class="brand" aria-label="santranc.net ana sayfa">
      <img src="/logolar/santrancnetbeyaz.png" alt="santranc.net">
    </a>
    <a href="/" class="back-link">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      Tahtaya dön
    </a>
  </header>

  <main class="main-wrap">
    <div class="watermark-404">404</div>

    <div class="visual-stage">
      <img src="/img/home-knight.png" alt="Tahta dışına çıkan at" class="floating-knight">
    </div>

    <h1>Tahtanın 65. karesini arıyorsun.</h1>

    <p class="desc">
      Satranç tahtası 64 kareyle sınırlıdır. Gitmek istediğin yer tahtanın sınırları dışına taştı veya oyun sırasında kayboldu.
    </p>

    <div class="actions-wrap">
      <a href="/" class="btn-play">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
        Hemen Oyna
      </a>
      <a href="/#kurallar" class="btn-rules">
        Kuralları İncele
      </a>
    </div>
  </main>

  <footer class="foot-info">
    <span>© 2026 santranc.net</span>
    <span>·</span>
    <img src="/logolar/logoeminbeyaz.png" alt="Emin">
  </footer>
</body>
</html>
