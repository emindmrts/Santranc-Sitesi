  <style>*,:before,:after{box-sizing:border-box;margin:0;padding:0}body{color:#fff;background:#000;flex-direction:column;justify-content:space-between;min-height:100vh;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Noto Sans,Ubuntu,Cantarell,Helvetica Neue,sans-serif;display:flex;position:relative;overflow-x:hidden}.ambient-glow{pointer-events:none;z-index:0;filter:blur(40px);background:radial-gradient(circle,#3b82f624 0%,#9333ea14 40%,#0000 75%);width:min(700px,90vw);height:min(450px,60vh);position:absolute;top:15%;left:50%;transform:translate(-50%,-20%)}.top-bar{z-index:10;justify-content:space-between;align-items:center;width:100%;max-width:1380px;margin:0 auto;padding:24px 32px;display:flex;position:relative}.brand img{width:auto;height:22px;display:block}.back-link{color:#ffffffb3;background:#ffffff08;border:1px solid #ffffff1a;border-radius:9999px;align-items:center;gap:6px;padding:6px 14px;font-size:13.5px;text-decoration:none;transition:all .2s;display:inline-flex}.back-link:hover{color:#fff;background:#ffffff14;border-color:#ffffff40;transform:translate(-2px)}.main-wrap{z-index:10;text-align:center;flex-direction:column;align-items:center;max-width:900px;margin:auto;padding:40px 24px 60px;display:flex;position:relative}.visual-stage{place-items:center;width:220px;height:220px;margin-bottom:24px;display:grid;position:relative}.floating-knight{-webkit-user-select:none;user-select:none;pointer-events:none;filter:drop-shadow(0 24px 32px #000000d9)drop-shadow(0 0 20px #3b82f633);width:170px;height:auto;animation:5s ease-in-out infinite alternate knightDrift;display:block}@keyframes knightDrift{0%{transform:translateY(4px)rotate(-2deg)}50%{transform:translateY(-8px)rotate(1deg)}to{transform:translateY(-16px)rotate(-3deg)}}.watermark-404{color:#ffffff09;letter-spacing:-.06em;pointer-events:none;-webkit-user-select:none;user-select:none;z-index:0;font-family:PT Serif,Georgia,serif;font-size:clamp(160px,24vw,280px);font-weight:700;line-
